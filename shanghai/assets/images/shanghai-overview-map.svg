<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Shanghai Illustrated Overview Map</title>
  <desc id="desc">Static illustrated overview map of key Shanghai travel zones including Huangpu River, Puxi, Lujiazui, Hongqiao, Disney Resort, and Pudong Airport.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf1"/>
      <stop offset="100%" stop-color="#ffefd9"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="0.8" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe3a3"/>
      <stop offset="100%" stop-color="#ffb75f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7c2d12" flood-opacity="0.10"/>
    </filter>
    <style>
      .district { fill: rgba(255,255,255,0.58); stroke-width: 2.5; }
      .minor-road { fill: none; stroke: #f3d9aa; stroke-width: 5; stroke-linecap: round; }
      .major-road { fill: none; stroke: #e9a556; stroke-width: 10; stroke-linecap: round; }
      .ring-road { fill: none; stroke: #d97706; stroke-width: 6; stroke-dasharray: 20 16; opacity: 0.45; }
      .grid { fill: none; stroke: #f7dca8; stroke-width: 1.5; opacity: 0.35; }
      .park { fill: #e8f7df; stroke: #8cc27f; stroke-width: 2; }
      .water-label { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #b45309; letter-spacing: 0.18em; opacity: 0.7; }
      .zone-label { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #9a3412; }
      .sub-label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #92400e; }
      .small-label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #a16207; }
      .caption { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #7c2d12; letter-spacing: 0.08em; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>

  <g class="grid">
    <path d="M120 120H1680M120 250H1680M120 380H1680M120 510H1680M120 640H1680M120 770H1680M120 900H1680"/>
    <path d="M180 80V1020M380 80V1020M580 80V1020M780 80V1020M980 80V1020M1180 80V1020M1380 80V1020M1580 80V1020"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="190" y="110" width="880" height="760" rx="56" class="district" fill="#fff9ef" stroke="#efb366"/>
    <rect x="1110" y="180" width="330" height="220" rx="36" class="district" fill="#fffced" stroke="#efc14f"/>
    <rect x="1160" y="440" width="340" height="240" rx="38" class="district" fill="#f8fbff" stroke="#72a4ff"/>
    <rect x="1200" y="760" width="300" height="180" rx="34" class="district" fill="#fff6ef" stroke="#fb923c"/>
    <rect x="1480" y="520" width="210" height="130" rx="26" class="district" fill="#eff6ff" stroke="#60a5fa"/>
  </g>

  <g>
    <rect x="270" y="230" width="150" height="110" rx="24" class="park"/>
    <rect x="520" y="710" width="190" height="100" rx="28" class="park"/>
    <rect x="1310" y="520" width="110" height="70" rx="18" class="park"/>
  </g>

  <g>
    <path class="minor-road" d="M260 220C370 255 450 280 560 302C700 330 845 332 980 318"/>
    <path class="minor-road" d="M250 405C380 425 525 435 655 445C780 452 880 460 1015 455"/>
    <path class="minor-road" d="M245 615C390 630 520 638 665 645C820 653 930 665 1100 675"/>
    <path class="minor-road" d="M1240 255C1290 265 1350 285 1425 315"/>
    <path class="minor-road" d="M1185 540C1250 555 1310 570 1410 595"/>
    <path class="minor-road" d="M1190 825C1260 835 1335 842 1460 860"/>
    <path class="minor-road" d="M335 160C360 280 375 420 390 650C396 760 395 840 390 900"/>
    <path class="minor-road" d="M620 125C640 250 660 430 668 640C672 760 668 860 660 955"/>
    <path class="minor-road" d="M865 125C875 255 892 395 930 555C955 660 995 760 1060 850"/>
    <path class="minor-road" d="M1300 200C1305 300 1315 430 1315 640"/>
  </g>

  <g>
    <path class="major-road" d="M225 300C420 330 610 352 820 352C970 352 1070 346 1210 324"/>
    <path class="major-road" d="M230 540C420 563 575 575 770 575C900 575 1010 590 1145 615"/>
    <path class="major-road" d="M315 140C340 315 355 420 365 610C372 732 372 845 365 960"/>
    <path class="major-road" d="M985 240C1110 355 1200 405 1320 465C1420 515 1510 540 1660 555"/>
    <path class="major-road" d="M1000 620C1105 680 1180 728 1290 825"/>
    <path class="ring-road" d="M460 185C690 130 920 205 1015 395C1110 582 1052 825 835 900C615 975 335 900 255 690C178 490 250 250 460 185Z"/>
  </g>

  <g>
    <path d="M900 60C845 145 830 225 856 325C878 410 952 485 982 592C1014 702 1000 818 940 1040" fill="none" stroke="url(#river)" stroke-width="122" stroke-linecap="round" opacity="0.96"/>
    <path d="M915 95C862 177 850 248 872 335C893 423 962 491 990 596C1018 702 1006 808 952 1010" fill="none" stroke="#f97316" stroke-width="5" stroke-dasharray="16 18" opacity="0.35"/>
    <path d="M745 302C790 330 835 338 878 334" fill="none" stroke="#ffd48a" stroke-width="36" stroke-linecap="round" opacity="0.9"/>
    <path d="M748 304C792 324 832 330 874 328" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.25"/>
  </g>

  <g>
    <text x="1035" y="570" class="water-label" transform="rotate(90 1035 570)">HUANGPU RIVER</text>
    <text x="695" y="285" class="small-label">Suzhou Creek</text>
  </g>

  <g>
    <text x="510" y="280" class="zone-label">Puxi Core</text>
    <text x="470" y="330" class="sub-label">Jing'an / People's Square / Xintiandi</text>
    <text x="560" y="515" class="sub-label">Nanjing Road / Bund Corridor</text>

    <text x="1170" y="270" class="zone-label">Hongqiao</text>
    <text x="1180" y="314" class="sub-label">High-speed rail + airport side</text>

    <text x="1205" y="545" class="zone-label">Lujiazui</text>
    <text x="1205" y="590" class="sub-label">Financial district / skyline</text>

    <text x="1235" y="845" class="zone-label">Disney Resort</text>
    <text x="1235" y="888" class="sub-label">Pudong southeast</text>

    <text x="1500" y="585" class="sub-label">Pudong Airport</text>
  </g>

  <g>
    <circle cx="112" cy="130" r="34" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <path d="M112 92L121 122H103Z" fill="#ea580c"/>
    <path d="M112 168L104 138H120Z" fill="#fdba74"/>
    <text x="98" y="207" class="caption">N</text>
  </g>

  <g>
    <rect x="90" y="970" width="360" height="78" rx="22" fill="rgba(255,255,255,0.88)" stroke="#fdba74" stroke-width="2"/>
    <circle cx="135" cy="1009" r="9" fill="#ea580c"/>
    <text x="156" y="1016" class="caption">Food / cafes / local spots</text>
    <circle cx="358" cy="1009" r="9" fill="#3b82f6"/>
    <text x="379" y="1016" class="caption">Airport / transport</text>
  </g>
</svg>
